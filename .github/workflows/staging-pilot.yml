name: Mushavo staging offline pilot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-pilot.yml
      - pilot/**
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      report: ${{ steps.report.outputs.json }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.0'
          package-manager-cache: false

      - name: Read approved source commit
        id: source
        run: |
          source_sha=$(node -p 'require("./pilot/catalog.json").source.commit')
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dwtdhruvp246/mushavobudget
          ref: ${{ steps.source.outputs.sha }}
          path: app-source
          persist-credentials: false

      - name: Run fixture checks without a network
        run: |
          sudo --non-interactive unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v node)" pilot/run.mjs app-source pilot-output/report.json

      - name: Record run result
        id: report
        if: always()
        run: |
          if [[ ! -f pilot-output/report.json ]]; then
            mkdir -p pilot-output
            printf '%s\n' '{"schemaVersion":1,"stage":"3/10","fr":"FR.3.3","batch":"STAGING-OFFLINE-PILOT","status":"BLOCKED","exitCode":1,"reason":"RUNNER_SETUP_INCOMPLETE"}' > pilot-output/report.json
          fi
          {
            printf '### Stage 3/10 | FR.3.3 | Staging offline pilot\n\n```json\n'
            cat pilot-output/report.json
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'json=%s\n' "$(node -p 'JSON.stringify(require("./pilot-output/report.json"))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-offline-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: pilot-output/report.json
          if-no-files-found: error
          retention-days: 30

  record-history:
    needs: pilot
    if: ${{ always() && !cancelled() && github.repository == 'dwtdhruvp246/mushavo-budget-staging-ops' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: staging-pilot-history
      queue: max

    steps:
      - name: Append the safe run report to pilot history
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RESULT: ${{ needs.pilot.result }}
          PILOT_REPORT: ${{ needs.pilot.outputs.report }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/pilot-history-request.json"
          import base64
          import json
          import os

          report = os.environ["PILOT_REPORT"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          entry = {
              "runId": run,
              "attempt": int(attempt),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflowCommit": os.environ["GITHUB_SHA"],
              "jobResult": os.environ["PILOT_RESULT"],
              "report": json.loads(report) if report else None,
          }
          contents = json.dumps(entry, indent=2) + "\n"
          print(json.dumps({
              "message": f"Record offline staging run {run} attempt {attempt}",
              "content": base64.b64encode(contents.encode()).decode(),
              "branch": "pilot-history",
          }))
          PY
          gh api --silent --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            --input "$RUNNER_TEMP/pilot-history-request.json"
